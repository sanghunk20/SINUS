[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sinus"
version = "1.0.0"
description = "SINUS — structure-wise radiology report generation from dental CBCT"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Sanghun Kim" }]

# Runtime dependencies are pinned in requirements.txt rather than here: torch has to come
# from the index that matches your CUDA build, so it is installed first and separately.
#
#   pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cu128
#   pip install -r requirements.txt
#   pip install -e .

[project.urls]
Homepage = "https://odin2026.grand-challenge.org/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toothfairy = ["configs/*.yaml"]
